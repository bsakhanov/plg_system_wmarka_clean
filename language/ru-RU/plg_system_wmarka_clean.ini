PLG_SYSTEM_WMARKA_CLEAN="Система — Webmarka Clean"
PLG_SYSTEM_WMARKA_CLEAN_XML_DESCRIPTION="Очистка текста материалов при вставке в визуальный редактор и при сохранении. Убирает мусор Word, Google Docs и Telegram — стили, шрифты, служебные классы, лишние теги, эмодзи и хештеги; сохраняет ссылки, якоря, сноски и разрешённые классы. Вставки видео и соцсетей хранит в тексте безопасной меткой, а на сайте строит из неё настоящую вставку."
PLG_SYSTEM_WMARKA_CLEAN_SAVE="Чистить при сохранении материала"
PLG_SYSTEM_WMARKA_CLEAN_SAVE_DESC="Тот же набор правил на сервере: сработает и при вставке через «Код», из другого редактора, при импорте, и на правках через API и ассистентов."
PLG_SYSTEM_WMARKA_CLEAN_PASTE="Чистить при вставке в редактор"
PLG_SYSTEM_WMARKA_CLEAN_PASTE_DESC="Редактор сразу показывает вставленный из Word или Telegram текст без мусора: то, что видно, совпадает с тем, что сохранится."
PLG_SYSTEM_WMARKA_CLEAN_KEEP="Классы, которые остаются"
PLG_SYSTEM_WMARKA_CLEAN_KEEP_DESC="По одному шаблону в строке, «*» — любое окончание. Все остальные классы (в том числе MsoNormal, MsoTableGrid) убираются. По умолчанию — табличные классы UIkit 3; для шаблона на Bootstrap добавьте table*."
PLG_SYSTEM_WMARKA_CLEAN_EMPTY="Удалять пустые абзацы"
PLG_SYSTEM_WMARKA_CLEAN_EMPTY_DESC="Абзацы без текста, картинки, ссылки и таблицы (так Word передаёт пустые строки)."
PLG_SYSTEM_WMARKA_CLEAN_TABLES="Оформление таблицы (список «Класс»)"
PLG_SYSTEM_WMARKA_CLEAN_TABLES_DESC="По одному варианту в строке: «Название|классы». Показывается в окне свойств таблицы в редакторе."
PLG_SYSTEM_WMARKA_CLEAN_EMOJI="Убирать эмодзи и значки"
PLG_SYSTEM_WMARKA_CLEAN_EMOJI_DESC="Убираются все эмодзи (смайлы, жесты, предметы, флаги, цифры в рамке, ✅ ❗ ⚡ ©️ и любые другие пиктограммы Unicode), знаки из списка ниже и «**» подряд — из текста, заголовка и описания материала, при вставке в редактор и при сохранении. Остаются знак тенге ₸, обозначения списков (● ◉ ⬤ • и тире в начале абзаца), одиночная «*» (знак сноски), минус «−» перед числом и °C."
PLG_SYSTEM_WMARKA_CLEAN_EXTRA="Лишние знаки"
PLG_SYSTEM_WMARKA_CLEAN_EXTRA_DESC="Знаки, которые, кроме эмодзи, убираются из текста; через пробел. По умолчанию: № ≈ стрелки ↑ ↓ ← → ↔ ↕ ↗ ↘ ↖ ↙, ★ ☆ ✓ ✗ ✘. Минус «−» и °C сюда не включены: без минуса у числа пропадёт знак (−0,25 станет 0,25), а °C — единица измерения."
PLG_SYSTEM_WMARKA_CLEAN_HASHTAGS="Убирать хештеги"
PLG_SYSTEM_WMARKA_CLEAN_HASHTAGS_DESC="Хештеги в конце текста и строки из одних хештегов убираются целиком; внутри предложения (рубрику #ЧитаемКниги — …) убирается только «#», слово остаётся."
PLG_SYSTEM_WMARKA_CLEAN_LINKS="Ссылки в новой вкладке"
PLG_SYSTEM_WMARKA_CLEAN_LINKS_DESC="В тексте материала ссылки получают target=_blank и rel=noopener. «#Якоря» (сноски, оглавление), mailto и tel остаются в той же вкладке."
PLG_SYSTEM_WMARKA_CLEAN_LINKS_ALL="Все ссылки"
PLG_SYSTEM_WMARKA_CLEAN_LINKS_EXTERNAL="Только внешние"
PLG_SYSTEM_WMARKA_CLEAN_LINKS_OFF="Не менять"
PLG_SYSTEM_WMARKA_CLEAN_HOSTS="Хосты, вставки с которых разрешены"
PLG_SYSTEM_WMARKA_CLEAN_HOSTS_DESC="Вставки соцсетей и видео (YouTube, TikTok, Instagram, Facebook, Telegram, X, Threads и другие): iframe с адресом этих хостов (через пробел, поддомены включены) сохраняется в тексте безопасной меткой — её пропускают фильтры текста Joomla, — а на сайте плагин строит из неё настоящую вставку. iframe с других хостов удаляется."
PLG_SYSTEM_WMARKA_CLEAN_RENDER="Строить вставки на сайте"
PLG_SYSTEM_WMARKA_CLEAN_RENDER_DESC="Метки вставок в тексте статьи плагин на сайте превращает в настоящие вставки — iframe разрешённых хостов с отложенной загрузкой, — а для цитат соцсетей подключает скрипт площадки. Выключите, если вставки строит шаблон."
PLG_SYSTEM_WMARKA_CLEAN_MERGE_READMORE="Без разделителя «Читать далее»"
PLG_SYSTEM_WMARKA_CLEAN_MERGE_READMORE_DESC="При сохранении введение и основной текст склеиваются в одно поле, черта <hr id=\"system-readmore\"> убирается, а анонс режется настройками длины. По умолчанию выключено."
PLG_SYSTEM_WMARKA_CLEAN_MIGRATED="Настройки перенесены из плагина «The Tenge: очистка текста», он выключен, чтобы текст не чистился дважды."
