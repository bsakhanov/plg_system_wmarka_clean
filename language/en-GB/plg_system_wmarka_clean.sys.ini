PLG_SYSTEM_WMARKA_CLEAN_XML_DESCRIPTION="Cleans article text on paste into the visual editor and on save. Removes the clutter of Word, Google Docs and Telegram — styles, fonts, service classes, stray tags, emoji and hashtags — and keeps links, anchors, footnotes and allowed classes. Video and social embeds are stored in the text as a safe marker and built into a real embed on the site."
