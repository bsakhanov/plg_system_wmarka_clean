PLG_SYSTEM_WMARKA_CLEAN="System — Webmarka Clean"
PLG_SYSTEM_WMARKA_CLEAN_XML_DESCRIPTION="Cleans article text on paste into the visual editor and on save. Removes the clutter of Word, Google Docs and Telegram — styles, fonts, service classes, stray tags, emoji and hashtags — and keeps links, anchors, footnotes and allowed classes. Video and social embeds are stored in the text as a safe marker and built into a real embed on the site."
PLG_SYSTEM_WMARKA_CLEAN_SAVE="Clean on save"
PLG_SYSTEM_WMARKA_CLEAN_SAVE_DESC="The same rules on the server: they also apply to text inserted through «Code», from another editor, on import, and to edits made through the API and assistants."
PLG_SYSTEM_WMARKA_CLEAN_PASTE="Clean on paste"
PLG_SYSTEM_WMARKA_CLEAN_PASTE_DESC="The editor shows text pasted from Word or Telegram already clean: what you see is what will be saved."
PLG_SYSTEM_WMARKA_CLEAN_KEEP="Classes to keep"
PLG_SYSTEM_WMARKA_CLEAN_KEEP_DESC="One pattern per line, «*» matches any ending. All other classes (MsoNormal, MsoTableGrid included) are removed. By default the table classes of UIkit 3; for a Bootstrap template add table*."
PLG_SYSTEM_WMARKA_CLEAN_EMPTY="Remove empty paragraphs"
PLG_SYSTEM_WMARKA_CLEAN_EMPTY_DESC="Paragraphs without text, image, link or table (this is how Word passes empty lines)."
PLG_SYSTEM_WMARKA_CLEAN_TABLES="Table styles (the «Class» list)"
PLG_SYSTEM_WMARKA_CLEAN_TABLES_DESC="One option per line: «Title|classes». Shown in the table properties dialog of the editor."
PLG_SYSTEM_WMARKA_CLEAN_EMOJI="Remove emoji and symbols"
PLG_SYSTEM_WMARKA_CLEAN_EMOJI_DESC="All emoji (faces, gestures, objects, flags, keycaps, ✅ ❗ ⚡ ©️ and any other Unicode pictograph), the symbols listed below and repeated «**» are removed from the text, title and description of an article, on paste and on save. The tenge sign ₸, list markers (● ◉ ⬤ • and a dash at the start of a paragraph), a single «*» (footnote mark), the minus «−» before a number and °C stay."
PLG_SYSTEM_WMARKA_CLEAN_EXTRA="Extra symbols"
PLG_SYSTEM_WMARKA_CLEAN_EXTRA_DESC="Symbols removed besides emoji, separated by spaces. By default: № ≈ arrows ↑ ↓ ← → ↔ ↕ ↗ ↘ ↖ ↙, ★ ☆ ✓ ✗ ✘. The minus «−» and °C are not included: without the minus a number loses its sign (−0.25 becomes 0.25), and °C is a unit."
PLG_SYSTEM_WMARKA_CLEAN_HASHTAGS="Remove hashtags"
PLG_SYSTEM_WMARKA_CLEAN_HASHTAGS_DESC="Hashtags at the end of the text and lines of hashtags only are removed entirely; inside a sentence only the «#» goes and the word stays."
PLG_SYSTEM_WMARKA_CLEAN_LINKS="Links in a new tab"
PLG_SYSTEM_WMARKA_CLEAN_LINKS_DESC="Links in the article text get target=_blank and rel=noopener. «#Anchors» (footnotes, contents), mailto and tel stay in the same tab."
PLG_SYSTEM_WMARKA_CLEAN_LINKS_ALL="All links"
PLG_SYSTEM_WMARKA_CLEAN_LINKS_EXTERNAL="External only"
PLG_SYSTEM_WMARKA_CLEAN_LINKS_OFF="Leave as is"
PLG_SYSTEM_WMARKA_CLEAN_HOSTS="Hosts allowed for embeds"
PLG_SYSTEM_WMARKA_CLEAN_HOSTS_DESC="Video and social embeds (YouTube, TikTok, Instagram, Facebook, Telegram, X, Threads and others): an iframe of these hosts (space-separated, subdomains included) is stored in the text as a safe marker that Joomla text filters let through, and the plugin builds the real embed from it on the site. Iframes of other hosts are removed."
PLG_SYSTEM_WMARKA_CLEAN_RENDER="Build embeds on the site"
PLG_SYSTEM_WMARKA_CLEAN_RENDER_DESC="On the site the plugin turns embed markers in article text into real embeds — lazy-loaded iframes of allowed hosts — and loads the platform script for social quotes. Turn it off if your template builds embeds itself."
PLG_SYSTEM_WMARKA_CLEAN_MERGE_READMORE="Without the «Read more» divider"
PLG_SYSTEM_WMARKA_CLEAN_MERGE_READMORE_DESC="On save the intro and full text are joined into one field and the <hr id=\"system-readmore\"> line is removed; the teaser is cut by length settings. Off by default."
PLG_SYSTEM_WMARKA_CLEAN_MIGRATED="Settings were carried over from the «The Tenge: text cleaning» plugin, which has been disabled so the text is not cleaned twice."
