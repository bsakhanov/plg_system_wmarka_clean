PLG_SYSTEM_WMARKA_CLEAN="Жүйе — Webmarka Clean"
PLG_SYSTEM_WMARKA_CLEAN_XML_DESCRIPTION="Мақала мәтінін визуалды редакторға қойғанда және сақтағанда тазалайды. Word, Google Docs пен Telegram қоқысын — стильдерді, қаріптерді, қызметтік кластарды, артық тегтерді, эмодзи мен хэштегтерді алып тастайды; сілтемелерді, якорьларды, ескертпелерді және рұқсат етілген кластарды сақтайды. Видео мен әлеуметтік желі ендірмелерін мәтінде қауіпсіз белгі ретінде сақтап, сайтта одан нағыз ендірме құрады."
PLG_SYSTEM_WMARKA_CLEAN_SAVE="Мақаланы сақтағанда тазалау"
PLG_SYSTEM_WMARKA_CLEAN_SAVE_DESC="Серверде дәл сол ережелер жұмыс істейді: «Код» арқылы, басқа редактордан қойғанда, импорт кезінде, API мен ассистенттер арқылы түзеткенде де."
PLG_SYSTEM_WMARKA_CLEAN_PASTE="Редакторға қойғанда тазалау"
PLG_SYSTEM_WMARKA_CLEAN_PASTE_DESC="Word немесе Telegram-нан қойылған мәтінді редактор бірден қоқыссыз көрсетеді: көрінгені сақталатынымен бірдей."
PLG_SYSTEM_WMARKA_CLEAN_KEEP="Қалатын кластар"
PLG_SYSTEM_WMARKA_CLEAN_KEEP_DESC="Әр жолға бір үлгі, «*» — кез келген соңы. Басқа кластардың бәрі (соның ішінде MsoNormal, MsoTableGrid) алынып тасталады. Әдепкіде — UIkit 3 кесте кластары; Bootstrap негізіндегі шаблонға table* қосыңыз."
PLG_SYSTEM_WMARKA_CLEAN_EMPTY="Бос абзацтарды жою"
PLG_SYSTEM_WMARKA_CLEAN_EMPTY_DESC="Мәтіні, суреті, сілтемесі мен кестесі жоқ абзацтар (Word бос жолдарды осылай береді)."
PLG_SYSTEM_WMARKA_CLEAN_TABLES="Кестенің безендірілуі («Класс» тізімі)"
PLG_SYSTEM_WMARKA_CLEAN_TABLES_DESC="Әр жолға бір нұсқа: «Атауы|кластар». Редактордағы кесте қасиеттері терезесінде көрсетіледі."
PLG_SYSTEM_WMARKA_CLEAN_EMOJI="Эмодзи мен белгішелерді алып тастау"
PLG_SYSTEM_WMARKA_CLEAN_EMOJI_DESC="Барлық эмодзи (смайликтер, ым-ишара, заттар, жалаушалар, жақтаудағы сандар, ✅ ❗ ⚡ және Unicode-тың басқа пиктограммалары), «Артық белгілер» тізіміндегі белгілер және қатар тұрған «**» мақаланың мәтінінен, тақырыбынан және сипаттамасынан — редакторға қойғанда да, сақтағанда да алынады. Валюта белгілері (₸ ₽ $ € £ ¥ және басқалар), №, §, градус °, ± × ≈ ‰, бөлшектер, тізім белгілері (● ◉ ⬤ • және абзац басындағы сызықша), жалғыз «*» (ескертпе белгісі), сан алдындағы минус «−» және «Қалатын белгілер» тізіміндегі белгілер қалады."
PLG_SYSTEM_WMARKA_CLEAN_EXTRA="Артық белгілер"
PLG_SYSTEM_WMARKA_CLEAN_EXTRA_DESC="Эмодзиден бөлек мәтіннен алынатын белгілер, бос орын арқылы. Әдепкіде — ↑ ↓ ← → ↔ ↕ ↗ ↘ ↖ ↙ көрсеткілері және жазбалардағы ★ ☆ ✓ ✗ ✘ белгішелері. Өріс бос болса, тек эмодзи алынады."
PLG_SYSTEM_WMARKA_CLEAN_KEEP_SYMBOLS="Қалатын белгілер"
PLG_SYSTEM_WMARKA_CLEAN_KEEP_SYMBOLS_DESC="Ешқашан алынбайтын белгілер — эмодзи ретінде де, артық белгілер тізімінен де; бос орын арқылы. Әдепкіде © ® ™: Unicode оларды пиктограмма деп санайды, ал мәтінде бұлар авторлық құқық пен тауар белгісінің таңбалары. Мысалы, байланыс үшін ☎ ✉, рейтинг үшін ★ қосыңыз. Валюта белгілері, №, §, градус, ± × ≈ ‰ және бөлшектер эмодзи емес, олар бәрібір қалады. Мәтіндегі «©️» «©» болады."
PLG_SYSTEM_WMARKA_CLEAN_HASHTAGS="Хэштегтерді алып тастау"
PLG_SYSTEM_WMARKA_CLEAN_HASHTAGS_DESC="Мәтін соңындағы хэштегтер мен тек хэштегтерден тұратын жолдар толық алынады; сөйлем ішінде тек «#» алынады да, сөз қалады."
PLG_SYSTEM_WMARKA_CLEAN_LINKS="Сілтемелер жаңа қойындыда"
PLG_SYSTEM_WMARKA_CLEAN_LINKS_DESC="Мақала мәтініндегі сілтемелерге target=_blank және rel=noopener қосылады. «#Якорьлар» (ескертпелер, мазмұн), mailto мен tel сол қойындыда қалады."
PLG_SYSTEM_WMARKA_CLEAN_LINKS_ALL="Барлық сілтемелер"
PLG_SYSTEM_WMARKA_CLEAN_LINKS_EXTERNAL="Тек сыртқы"
PLG_SYSTEM_WMARKA_CLEAN_LINKS_OFF="Өзгертпеу"
PLG_SYSTEM_WMARKA_CLEAN_HOSTS="Ендіруге рұқсат етілген хосттар"
PLG_SYSTEM_WMARKA_CLEAN_HOSTS_DESC="Видео мен әлеуметтік желі ендірмелері (YouTube, TikTok, Instagram, Facebook, Telegram, X, Threads және басқалар): осы хосттардың (бос орын арқылы, субдомендер де кіреді) мекенжайы бар iframe мәтінде Joomla сүзгілері өткізетін қауіпсіз белгі ретінде сақталады, ал сайтта плагин одан нағыз ендірме құрады. Басқа хосттардың iframe-і жойылады."
PLG_SYSTEM_WMARKA_CLEAN_RENDER="Сайтта ендірмелерді құру"
PLG_SYSTEM_WMARKA_CLEAN_RENDER_DESC="Мақала мәтініндегі ендірме белгілерін плагин сайтта нағыз ендірмеге — рұқсат етілген хосттардың кешіктіріп жүктелетін iframe-іне — айналдырады, ал әлеуметтік желі дәйексөздері үшін сол желінің скриптін қосады. Ендірмелерді шаблон құратын болса, өшіріңіз."
PLG_SYSTEM_WMARKA_CLEAN_MERGE_READMORE="«Толығырақ» бөлгішісіз"
PLG_SYSTEM_WMARKA_CLEAN_MERGE_READMORE_DESC="Сақтағанда кіріспе мен негізгі мәтін бір өріске біріктіріліп, <hr id=\"system-readmore\"> сызығы алынады, ал анонс ұзындық баптауларымен қиылады. Әдепкіде өшірулі."
PLG_SYSTEM_WMARKA_CLEAN_MIGRATED="Баптаулар «The Tenge: очистка текста» плагинінен көшірілді; мәтін екі рет тазаланбас үшін ол өшірілді."
